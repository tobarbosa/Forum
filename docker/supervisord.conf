; Supervisord config que SUBSTITUI o original do Sail
; Adiciona o program `vite` para que `sail up` traga o Vite junto (sem terminal extra).
;
; O start-container do Sail passa `-c /etc/supervisor/conf.d/supervisord.conf`,
; então este arquivo é o único carregado (o [include] do /etc/supervisor/supervisord.conf
; não é lido porque não é o arquivo de config ativo).
;
; O `supervisord-vite.conf` antigo foi removido — não há mais conf.d/* include aqui.

[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:php]
command=%(ENV_SUPERVISOR_PHP_COMMAND)s
user=%(ENV_SUPERVISOR_PHP_USER)s
environment=LARAVEL_SAIL="1"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:vite]
command=/usr/bin/npm run dev
directory=/var/www/html
user=sail
environment=LARAVEL_SAIL="1"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
